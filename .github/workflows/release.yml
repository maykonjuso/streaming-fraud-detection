name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          VERSION="2.4.0"
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp
          sudo mv /tmp/git-cliff /usr/local/bin/git-cliff

      - name: Generate full CHANGELOG
        run: git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Generate release notes (current tag only)
        id: notes
        run: |
          {
            echo "content<<EOF"
            git-cliff --config cliff.toml --current --strip all
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit updated CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ github.ref_name }}" || true
          git push origin HEAD:main || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -q "-"; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.content }}" \
            $PRERELEASE
