[tool.ruff]
target-version = "py311"
line-length = 100
src = ["producer", "streaming", "ml", "api", "agents", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires running infrastructure (deselect with -m 'not integration')"]
asyncio_mode = "auto"
filterwarnings = [
    # opentelemetry transitively imported by mlflow — not our code
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
    # pyod ECOD precision warning on small datasets (expected in unit test fixtures)
    "ignore:Precision loss occurred in moment calculation:RuntimeWarning",
]

[tool.coverage.run]
source = ["ml", "api"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
